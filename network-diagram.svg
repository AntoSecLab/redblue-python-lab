<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: bold; fill: #1a1a1a; }
      .subtitle { font-size: 12px; fill: #666; }
      .vlan-label { font-size: 14px; font-weight: bold; }
      .vm-name { font-size: 14px; font-weight: bold; fill: #1a1a1a; }
      .vm-ip { font-size: 11px; fill: #444; font-family: monospace; }
      .net-label { font-size: 11px; fill: #666; font-family: monospace; }
      .legend { font-size: 10px; fill: #666; }
    </style>
  </defs>

  <rect width="900" height="650" fill="#f8f9fa"/>

  <text x="450" y="30" text-anchor="middle" class="title">🛡️ Red Blue Python Lab - Architecture réseau</text>
  <text x="450" y="50" text-anchor="middle" class="subtitle">Infrastructure virtualisée VMware - Lab Red Team vs Blue Team</text>

  <!-- INTERNET -->
  <g>
    <ellipse cx="450" cy="100" rx="90" ry="25" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
    <text x="450" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#0d47a1">🌍 INTERNET (via NAT)</text>
  </g>

  <!-- pfSense Router (centre) -->
  <g>
    <rect x="340" y="180" width="220" height="90" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="3"/>
    <text x="450" y="205" text-anchor="middle" font-size="16" font-weight="bold" fill="#e65100">🛡️ pfSense Router</text>
    <text x="450" y="225" text-anchor="middle" class="vm-ip">WAN: 192.168.56.229 (DHCP)</text>
    <text x="450" y="240" text-anchor="middle" class="subtitle">Firewall + Router + DHCP + DNS</text>
    <text x="450" y="258" text-anchor="middle" class="subtitle">5 interfaces (em0-em4)</text>
  </g>

  <!-- Line Internet to pfSense WAN -->
  <line x1="450" y1="125" x2="450" y2="180" stroke="#1976d2" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="460" y="155" font-size="10" fill="#666" font-family="monospace">eth0/em0 (NAT)</text>

  <!-- VLAN 10 - CLIENTS (gauche haut) -->
  <g>
    <rect x="30" y="350" width="200" height="130" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="130" y="375" text-anchor="middle" class="vlan-label" fill="#2e7d32">🟢 VLAN CLIENTS</text>
    <text x="130" y="392" text-anchor="middle" class="net-label">192.168.10.0/24</text>
    <text x="130" y="408" text-anchor="middle" class="subtitle">DHCP activé (.100-.200)</text>

    <rect x="50" y="420" width="160" height="50" rx="5" fill="#fff" stroke="#388e3c" stroke-width="1"/>
    <text x="130" y="438" text-anchor="middle" class="vm-name">💻 Windows 10</text>
    <text x="130" y="456" text-anchor="middle" class="subtitle">(à venir)</text>
  </g>

  <!-- VLAN 20 - SERVERS (droite haut) -->
  <g>
    <rect x="670" y="350" width="200" height="190" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="770" y="375" text-anchor="middle" class="vlan-label" fill="#1565c0">🔵 VLAN SERVERS</text>
    <text x="770" y="392" text-anchor="middle" class="net-label">192.168.20.0/24</text>
    <text x="770" y="408" text-anchor="middle" class="subtitle">Statique (DHCP désactivé)</text>

    <rect x="690" y="420" width="160" height="50" rx="5" fill="#fff" stroke="#1976d2" stroke-width="1"/>
    <text x="770" y="438" text-anchor="middle" class="vm-name">🪟 Win Server 2025</text>
    <text x="770" y="456" text-anchor="middle" class="subtitle">AD/DNS/DHCP (à venir)</text>

    <rect x="690" y="480" width="160" height="50" rx="5" fill="#fff" stroke="#d32f2f" stroke-width="1"/>
    <text x="770" y="498" text-anchor="middle" class="vm-name">🎯 Metasploitable 2</text>
    <text x="770" y="516" text-anchor="middle" class="vm-ip">192.168.20.100</text>
  </g>

  <!-- VLAN 30 - BLUE (gauche bas) -->
  <g>
    <rect x="30" y="530" width="200" height="90" rx="8" fill="#e1f5fe" stroke="#0277bd" stroke-width="2"/>
    <text x="130" y="555" text-anchor="middle" class="vlan-label" fill="#0277bd">💙 VLAN BLUE TEAM</text>
    <text x="130" y="572" text-anchor="middle" class="net-label">192.168.30.0/24</text>
    <text x="130" y="588" text-anchor="middle" class="subtitle">SIEM / Monitoring</text>
    <text x="130" y="606" text-anchor="middle" class="subtitle">Wazuh (Phase 8)</text>
  </g>

  <!-- VLAN 99 - RED (droite bas) -->
  <g>
    <rect x="670" y="560" width="200" height="60" rx="8" fill="#ffebee" stroke="#c62828" stroke-width="2"/>
    <text x="770" y="585" text-anchor="middle" class="vlan-label" fill="#c62828">🔴 VLAN RED TEAM</text>
    <text x="770" y="602" text-anchor="middle" class="net-label">192.168.99.0/24</text>
    <text x="770" y="617" text-anchor="middle" class="subtitle">DHCP activé</text>
  </g>

  <!-- Kali -->
  <g>
    <rect x="280" y="400" width="180" height="60" rx="5" fill="#fff" stroke="#c62828" stroke-width="2"/>
    <text x="370" y="420" text-anchor="middle" class="vm-name">🐉 Kali Linux (Red)</text>
    <text x="370" y="438" text-anchor="middle" class="vm-ip">eth0: 192.168.56.230 (NAT)</text>
    <text x="370" y="453" text-anchor="middle" class="vm-ip">eth1: 192.168.99.101 (DHCP)</text>
  </g>

  <!-- Arrows from pfSense to each VLAN -->
  <line x1="340" y1="270" x2="130" y2="350" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="310" font-size="10" fill="#2e7d32" font-family="monospace">em1 - 192.168.10.1</text>

  <line x1="560" y1="270" x2="770" y2="350" stroke="#1565c0" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="310" font-size="10" fill="#1565c0" font-family="monospace">em2 - 192.168.20.1</text>

  <line x1="340" y1="270" x2="130" y2="530" stroke="#0277bd" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="195" y="420" font-size="10" fill="#0277bd" font-family="monospace">em3 - 192.168.30.1</text>

  <line x1="560" y1="270" x2="770" y2="560" stroke="#c62828" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="420" font-size="10" fill="#c62828" font-family="monospace">em4 - 192.168.99.1</text>

  <!-- Line from Kali to RED VLAN -->
  <line x1="460" y1="430" x2="670" y2="580" stroke="#c62828" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g>
    <rect x="20" y="640" width="860" height="0" fill="none"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
